<script>
  // record start-up errors (shown by the self test, hidden otherwise)
  window.__bootErrors = [];
  window.addEventListener('error', function (e) { window.__bootErrors.push((e.message || 'error') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { window.__bootErrors.push('promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
  window.addEventListener('load', function () { setTimeout(function () { if (!window.__bootErrors.length) return; var p = document.createElement('pre'); p.id = 'boot-errors'; p.hidden = true; p.textContent = window.__bootErrors.join('\n'); document.body.appendChild(p); }, 3000); });
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-l">
      <button id="btn-menu" class="logo" type="button" title="Головне меню" aria-label="Головне меню" data-i18n-title="Головне меню" data-i18n-aria="Головне меню">
        <img class="logo-mark" src="Images/VIBSma_icon.svg" alt="VIBSma">
      </button>
      <button id="btn-projects" class="ib" type="button" title="Усі проєкти (Ctrl+Alt+O)" aria-label="Усі проєкти" data-i18n-title="Усі проєкти (Ctrl+Alt+O)" data-i18n-aria="Усі проєкти" data-icon="grid"></button>
      <nav id="menubar" aria-label="Меню" data-i18n-aria="Меню"></nav>
      <button id="btn-left" class="ib mob" type="button" title="Шари" aria-label="Шари" data-i18n-title="Шари" data-i18n-aria="Шари" data-icon="layers"></button>
    </div>
    <div class="tb-c">
      <span id="doc-name" title="Клацніть, щоб перейменувати" data-i18n-title="Клацніть, щоб перейменувати"></span><span class="slash">/</span><span id="page-name"></span>
      <span id="save-state" aria-live="polite"></span>
    </div>
    <div class="tb-r">
      <button id="btn-palette" class="ib" type="button" title="Швидкі дії (Ctrl+/)" aria-label="Швидкі дії" data-i18n-title="Швидкі дії (Ctrl+/)" data-i18n-aria="Швидкі дії" data-icon="search"></button>
      <button id="btn-lang" class="lang-ctl" type="button" title="Мова інтерфейсу" aria-label="Мова інтерфейсу" data-i18n-title="Мова інтерфейсу" data-i18n-aria="Мова інтерфейсу" data-icon="globe"><span id="lang-code">UK</span></button>
      <button id="btn-theme" class="ib" type="button" title="Світла / темна тема" aria-label="Перемкнути тему" data-i18n-title="Світла / темна тема" data-i18n-aria="Перемкнути тему" data-icon="moon"></button>
      <button id="btn-present" class="ib" type="button" title="Режим презентації (W)" aria-label="Презентація" data-i18n-title="Режим презентації (W)" data-i18n-aria="Презентація" data-icon="play"></button>
      <button id="zoom-btn" class="zoom-ctl" type="button" title="Масштаб перегляду" aria-label="Масштаб перегляду" data-i18n-title="Масштаб перегляду" data-i18n-aria="Масштаб перегляду"><span id="zoom-val">100%</span></button>
      <button id="btn-export" class="btn primary" type="button" title="Експорт (Ctrl+Shift+E)" aria-label="Експорт" data-i18n-title="Експорт (Ctrl+Shift+E)" data-i18n-aria="Експорт" data-icon="download"><span class="lbl" data-i18n="Експорт">Експорт</span></button>
      <button id="btn-right" class="ib mob" type="button" title="Властивості" aria-label="Властивості" data-i18n-title="Властивості" data-i18n-aria="Властивості" data-icon="sliders"></button>
    </div>
  </header>

  <div id="ws"></div>

  <aside id="left" aria-label="Шари та ресурси" data-i18n-aria="Шари та ресурси">
    <div class="ptabs" role="tablist"><button type="button" data-lt="layers" class="on" role="tab" data-i18n="Шари">Шари</button><button type="button" data-lt="assets" role="tab" data-i18n="Ресурси">Ресурси</button></div>
    <div id="lp-layers">
      <section class="pages" aria-label="Сторінки" data-i18n-aria="Сторінки">
        <div class="sec-h"><span data-i18n="Сторінки">Сторінки</span><button type="button" class="ib" data-a="addpage" title="Нова сторінка" aria-label="Нова сторінка" data-i18n-title="Нова сторінка" data-i18n-aria="Нова сторінка" data-icon="plus"></button></div>
        <div id="pages-list"></div>
      </section>
      <div class="sec-h"><span data-i18n="Шари">Шари</span></div>
      <div id="layers-list" role="tree" aria-label="Шари" data-i18n-aria="Шари"></div>
    </div>
    <div id="lp-assets" hidden>
      <section><div class="sec-h"><span data-i18n="Компоненти">Компоненти</span></div><div id="as-comps" class="as-grid"></div></section>
      <section><div class="sec-h"><span data-i18n="Кольори документа">Кольори документа</span><button type="button" class="ib" data-a="addsw" title="Додати колір виділеного об’єкта" aria-label="Додати колір" data-i18n-title="Додати колір виділеного об’єкта" data-i18n-aria="Додати колір" data-icon="plus"></button></div><div id="as-sw" class="as-sw"></div></section>
      <section><div class="sec-h"><span data-i18n="Шрифти">Шрифти</span><button type="button" class="ib" data-a="addfont" title="Завантажити файл шрифту" aria-label="Завантажити шрифт" data-i18n-title="Завантажити файл шрифту" data-i18n-aria="Завантажити шрифт" data-icon="plus"></button></div><div id="as-fonts"></div><button type="button" class="btn" data-a="gfonts" data-i18n="Google Fonts…">Google Fonts…</button><button type="button" class="btn" data-a="localfonts" data-i18n="Показати встановлені шрифти">Показати встановлені шрифти</button></section>
    </div>
  </aside>

  <main id="canvas" tabindex="-1" aria-label="Полотно" data-i18n-aria="Полотно">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs id="doc-defs"></defs><g id="viewport"><g id="doc-root"></g></g></svg>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="ruler-x" class="ruler" aria-hidden="true"></canvas>
    <canvas id="ruler-y" class="ruler" aria-hidden="true"></canvas>
    <div id="ruler-corner" class="ruler" title="Подвійний клік — видалити напрямні" data-i18n-title="Подвійний клік — видалити напрямні"></div>
    <textarea id="text-editor" hidden spellcheck="false" aria-label="Редагування тексту" data-i18n-aria="Редагування тексту"></textarea>
    <div id="tool-options" hidden></div>
    <div id="toolbar" role="toolbar" aria-label="Інструменти"></div>
    <div id="statusbar"><span id="coords"></span></div>
  </main>

  <aside id="right" aria-label="Властивості" data-i18n-aria="Властивості">
    <div class="ptabs" role="tablist"><button type="button" data-rt="design" class="on" role="tab" data-i18n="Дизайн">Дизайн</button><button type="button" data-rt="code" role="tab" data-i18n="Код">Код</button></div>
    <div id="props"></div>
    <div id="code" hidden></div>
  </aside>
</div>
